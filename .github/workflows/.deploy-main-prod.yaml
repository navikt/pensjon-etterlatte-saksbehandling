name: .deploy-main-prod.yaml

on:
  workflow_call:
    inputs:
      applikasjon:
        description: 'Navnet på applikasjonen'
        required: true
        type: string

env:
  image: europe-north1-docker.pkg.dev/nais-management-233d/etterlatte/pensjon-etterlatte-saksbehandling-etterlatte-${{ inputs.applikasjon }}:main

jobs:
  deploy-main:
    name: deploy-main-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: nais/deploy/actions/deploy@f93637de5533a1bb573f940ceb7527a5b3b0dea0 # ratchet:nais/deploy/actions/deploy@v2
        env:
          TELEMETRY: ${{ steps.docker-build-push.outputs.telemetry }}
          CLUSTER: prod-gcp
          RESOURCE: apps/etterlatte-${{ inputs.applikasjon }}/.nais/prod.yaml
          VAR: image=${{ env.image }}
