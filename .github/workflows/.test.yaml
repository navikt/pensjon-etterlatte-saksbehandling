name: .test.yaml

on:
  workflow_call:

jobs:
  determine-project-type:
    name: Determine project type
    runs-on: ubuntu-latest-8-cores
    outputs:
      type: ${{ steps.determine.outputs.type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - id: determine
        working-directory: apps/${{ github.workflow }}
        run: |
          if [ -f "package.json" ]; then
            echo "type=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "type=backend" >> "$GITHUB_OUTPUT"
          fi

  verify-backend:
    name: Verify pull request
    if: needs.determine-project-type.outputs.type == 'backend'
    needs: [determine-project-type]
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # ratchet:actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # ratchet:gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
      - name: Gradle test and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
        run: ./gradlew :apps:${{ github.workflow }}:test --stacktrace --configuration-cache

  verify-frontend:
    name: Verify pull request
    if: needs.determine-project-type.outputs.type == 'frontend'
    needs: [determine-project-type]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Install client
        working-directory: apps/${{ github.workflow }}
        run: yarn --cwd client install --frozen-lockfile && yarn --cwd client build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Install server
        working-directory: apps/${{ github.workflow }}
        run: yarn --cwd server install --frozen-lockfile && yarn --cwd server build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Run tests
        working-directory: apps/${{ github.workflow }}/client
        run: CI=true yarn test
