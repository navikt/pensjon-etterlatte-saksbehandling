apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: etterlatte-pdltjenester
  namespace: etterlatte
  labels:
    team: etterlatte
spec:
  image: "{{image}}"
  port: 8080
  liveness:
    initialDelay: 5
    path: /health/isalive
  readiness:
    initialDelay: 5
    path: /health/isready
  prometheus:
    enabled: true
    path: /metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    requests:
      cpu: 200m
      memory: 1024Mi
    limits:
      memory: 1024Mi
  replicas:
    scalingStrategy:
      cpu:
        thresholdPercentage: 90
    min: 2
    max: 4
  azure:
    application:
      enabled: true
      tenant: nav.no
      claims:
        groups:
          - id: e4eb614b-d37d-4721-ba1b-df8f0fd16f85 # 0000-GA-GJENNY_SAKSBEHANDLER
          - id: 2093e59c-d0a4-41c0-9dfc-39f710da5bba # 0000-GA-GJENNY_LES
          - id: 278dc5e6-89f5-4f2d-9b7f-d9389999201b # 0000-GA-GJENNY_ATTESTERING
          - id: 83909210-a83a-4e5e-93f5-c781c3812c78 # 0000-GA-GJENNY_UTVIDET
          - id: 2931da41-8b8e-42cd-99c0-04a169ddae40 # 0000-GA-Strengt_Fortrolig_Adresse
          - id: e98efc34-12d1-401f-b059-f17e62834065 # 0000-GA-Fortrolig_Adresse
          - id: e750ceb5-b70b-4d94-b4fa-9d22467b786b # 0000-GA-Egne_ansatte
  env:
    - name: JAVA_TOOL_OPTIONS
      value: "-XX:MaxRAMPercentage=50"
    - name: PDL_URL
      value: https://pdl-api.prod-fss-pub.nais.io/graphql
    - name: PDL_OUTBOUND_SCOPE
      value: api://prod-fss.pdl.pdl-api/.default
    - name: PPS_URL
      value: https://pensjon-parallelle-sannheter.intern.nav.no
  envFrom:
    - secret: my-application-unleash-api-token
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      external:
        - host: "pdl-api.prod-fss-pub.nais.io"
        - host: "pensjon-parallelle-sannheter.intern.nav.no"
        - host: etterlatte-unleash-api.nav.cloud.nais.io
    inbound:
      rules:
        - application: etterlatte-brev-api
        - application: etterlatte-hendelser-pdl
        - application: etterlatte-hendelser-joark
        - application: etterlatte-behandling
        - application: etterlatte-saksbehandling-ui
