apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: etterlatte-trygdetid
  namespace: etterlatte
  labels:
    team: etterlatte
spec:
  image: "{{image}}"
  port: 8080
  liveness:
    initialDelay: 5
    path: /health/isalive
  readiness:
    initialDelay: 5
    path: /health/isready
  leaderElection: true
  prometheus:
    enabled: true
    path: /metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  gcp:
    sqlInstances:
      - type: POSTGRES_14
        tier: db-custom-1-3840
        collation: nb_NO.UTF8
        cascadingDelete: false
        name: etterlatte-trygdetid
        diskAutoresize: true
        diskSize: 30
        diskType: SSD
        highAvailability: true
        pointInTimeRecovery: true
        autoBackupHour: 1
        maintenance:
          day: 7
          hour: 2
        databases:
          - name: trygdetid
            envVarPrefix: DB
        flags:
          - name: max_connections
            value: "100"
  azure:
    application:
      enabled: true
      tenant: nav.no
      claims:
        groups:
          - id: e4eb614b-d37d-4721-ba1b-df8f0fd16f85 # 0000-GA-GJENNY_SAKSBEHANDLER
          - id: 2093e59c-d0a4-41c0-9dfc-39f710da5bba # 0000-GA-GJENNY_LES
          - id: 278dc5e6-89f5-4f2d-9b7f-d9389999201b # 0000-GA-GJENNY_ATTESTERING
          - id: 83909210-a83a-4e5e-93f5-c781c3812c78 # 0000-GA-GJENNY_UTVIDET
          - id: 2931da41-8b8e-42cd-99c0-04a169ddae40 # 0000-GA-Strengt_Fortrolig_Adresse
          - id: e98efc34-12d1-401f-b059-f17e62834065 # 0000-GA-Fortrolig_Adresse
          - id: e750ceb5-b70b-4d94-b4fa-9d22467b786b # 0000-GA-Egne_ansatte
  resources:
    requests:
      cpu: 25m
      memory: 1000Mi
    limits:
      memory: 1000Mi
  replicas:
    scalingStrategy:
      cpu:
        thresholdPercentage: 90
    max: 4
    min: 2
  env:
    - name: ETTERLATTE_BEHANDLING_URL
      value: http://etterlatte-behandling
    - name: ETTERLATTE_BEHANDLING_CLIENT_ID
      value: prod-gcp.etterlatte.etterlatte-behandling
    - name: PEN_URL
      value: https://pensjon-pen.prod-fss-pub.nais.io/pen
    - name: PEN_CLIENT_ID
      value: 53eaf67f-d7b2-46e9-8ffe-3da7cf0ac955
  envFrom:
    - secret: my-application-unleash-api-token
  accessPolicy:
    inbound:
      rules:
        - application: etterlatte-saksbehandling-ui
        - application: etterlatte-behandling
        - application: etterlatte-beregning
        - application: etterlatte-brev-api
        - application: etterlatte-trygdetid-kafka
    outbound:
      rules:
        - application: etterlatte-behandling
        - application: logging
          namespace: nais-system
      external:
        - host: etterlatte-unleash-api.nav.cloud.nais.io
        - host: pensjon-pen.prod-fss-pub.nais.io
